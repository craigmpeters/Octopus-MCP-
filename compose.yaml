services:
  octopusmcp:
    container_name: octopusmcp
    image: ghcr.io/craigmpeters/octopus-mcp:latest
    restart: unless-stopped
    environment:
      OCTOPUS_ACCOUNT_NUMBER: "A-XXXXXXXX"
      OCTOPUS_API_KEY: "replace-with-your-api-key"
    ports:
      - "127.0.0.1:8765:8000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
